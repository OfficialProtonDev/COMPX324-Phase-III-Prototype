<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const goals = Proto.goals();
    const pinned = goals.filter((g) => g.pinned);
    const active = goals.filter((g) => !g.pinned && g.active);
    const done = goals.filter((g) => g.done);
    const total = goals.reduce((sum, g) => sum + g.saved, 0);
    const n = goals.length;
    return {
      totalSaved: '$' + total.toLocaleString('en-NZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
      totalNote: 'across ' + n + (n === 1 ? ' goal' : ' goals') + ' \u00b7 ' + done.length + ' complete',
      pinnedGoals: pinned,
      otherGoals: active.concat(done),
      showDivider: pinned.length > 0 && active.length + done.length > 0
    };
  }
}
</script>
