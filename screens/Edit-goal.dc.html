</helmet>
<div style="position: relative; width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F2F7EC; color: #1C3020; font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.4">
<header style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 12px 12px 4px">
<a href="{{backHref}}" aria-label="Back to Goal details" style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; color: #1C3020; text-decoration: none"><svg width="24" height="24" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; flex: 1; font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif; font-size: 22px; line-height: 28px; font-weight: 600">Edit goal</h1>
</header>
<main style="flex: 1; min-height: 0; overflow-y: auto">
<div style="display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 28px">

<section aria-label="Goal" style="display: flex; flex-direction: column; gap: 16px; padding: 18px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(28,48,32,0.06), 0 6px 18px rgba(28,48,32,0.06)">
<div style="display: flex; flex-direction: column; gap: 6px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 600">Goal name
<input type="text" value="{{name}}" sc-camel-on-change="{{setName}}" style="height: 48px; padding: 0 14px; box-sizing: border-box; border: 1.5px solid {{nameBd}}; border-radius: 14px; background: #FFFFFF; color: #1C3020; font-family: inherit; font-size: 16px; font-weight: 500">
</label>
<sc-if value="{{nameErrShow}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 13px; line-height: 18px; font-weight: 600; color: #B42318">{{nameErr}}</p></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 600">Target amount
<span style="display: flex; align-items: center; gap: 4px; height: 48px; padding: 0 14px; box-sizing: border-box; border: 1.5px solid {{amountBd}}; border-radius: 14px; background: #FFFFFF; color: #4A5F4D; font-size: 16px; font-weight: 600">$<input type="text" inputmode="decimal" value="{{amount}}" sc-camel-on-change="{{setAmount}}" style="flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: transparent; color: #1C3020; font-family: inherit; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums"></span>
</label>
<sc-if value="{{amountErrShow}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 13px; line-height: 18px; font-weight: 600; color: #B42318">{{amountErr}}</p></sc-if>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 600"><span>Description <span style="font-weight: 500; color: #4A5F4D">(optional)</span></span>
<textarea rows="4" value="{{desc}}" sc-camel-on-change="{{setDesc}}" style="height: 118px; padding: 12px 14px; box-sizing: border-box; resize: none; border: 1.5px solid #C5D6B8; border-radius: 14px; background: #FFFFFF; color: #1C3020; font-family: inherit; font-size: 16px; font-weight: 500; line-height: 1.4"></textarea>
</label>
</section>

<section aria-label="Timing and priority" style="display: flex; flex-direction: column; gap: 18px; padding: 18px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(28,48,32,0.06), 0 6px 18px rgba(28,48,32,0.06)">
<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
<legend style="padding: 0; font-size: 14px; line-height: 20px; font-weight: 600">Save by</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 6px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; line-height: 16px; font-weight: 600; color: #4A5F4D">Day<input type="text" inputmode="numeric" value="{{day}}" sc-camel-on-change="{{setDay}}" style="height: 48px; padding: 0 12px; box-sizing: border-box; border: 1.5px solid {{dateBd}}; border-radius: 14px; background: #FFFFFF; color: #1C3020; font-family: inherit; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; line-height: 16px; font-weight: 600; color: #4A5F4D">Month<input type="text" inputmode="numeric" value="{{month}}" sc-camel-on-change="{{setMonth}}" style="height: 48px; padding: 0 12px; box-sizing: border-box; border: 1.5px solid {{dateBd}}; border-radius: 14px; background: #FFFFFF; color: #1C3020; font-family: inherit; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; line-height: 16px; font-weight: 600; color: #4A5F4D">Year<input type="text" inputmode="numeric" value="{{year}}" sc-camel-on-change="{{setYear}}" style="height: 48px; padding: 0 12px; box-sizing: border-box; border: 1.5px solid {{dateBd}}; border-radius: 14px; background: #FFFFFF; color: #1C3020; font-family: inherit; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums"></label>
</div>
<sc-if value="{{dateErrShow}}" hint-placeholder-val="{{ false }}"><p style="margin: 6px 0 0; font-size: 13px; line-height: 18px; font-weight: 600; color: #B42318">{{dateErr}}</p></sc-if>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
<legend style="padding: 0; font-size: 14px; line-height: 20px; font-weight: 600">Priority</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px">
<label style="position: relative; display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 48px; padding: 0 6px; box-sizing: border-box; border: 2px solid {{high.border}}; border-radius: 14px; background: {{high.bg}}; font-size: 15px; font-weight: {{high.weight}}; cursor: pointer"><input type="radio" name="priority" value="high" checked="{{high.checked}}" sc-camel-on-change="{{pickHigh}}" style="position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0"><span aria-hidden="true" style="flex-shrink: 0; width: 12px; height: 12px; border-radius: 50%; background: #B93A2B"></span>High</label>
<label style="position: relative; display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 48px; padding: 0 6px; box-sizing: border-box; border: 2px solid {{medium.border}}; border-radius: 14px; background: {{medium.bg}}; font-size: 15px; font-weight: {{medium.weight}}; cursor: pointer"><input type="radio" name="priority" value="medium" checked="{{medium.checked}}" sc-camel-on-change="{{pickMedium}}" style="position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0"><span aria-hidden="true" style="flex-shrink: 0; width: 12px; height: 12px; border-radius: 50%; background: #F2BE2E"></span>Medium</label>
<label style="position: relative; display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 48px; padding: 0 6px; box-sizing: border-box; border: 2px solid {{minimal.border}}; border-radius: 14px; background: {{minimal.bg}}; font-size: 15px; font-weight: {{minimal.weight}}; cursor: pointer"><input type="radio" name="priority" value="minimal" checked="{{minimal.checked}}" sc-camel-on-change="{{pickMinimal}}" style="position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0"><span aria-hidden="true" style="flex-shrink: 0; width: 12px; height: 12px; border-radius: 50%; background: #5FA83F"></span>Minimal</label>
</div>
</fieldset>
</section>

<label style="display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(28,48,32,0.06), 0 6px 18px rgba(28,48,32,0.06); cursor: pointer">
<input type="checkbox" checked="{{pinned}}" sc-camel-on-change="{{togglePin}}" style="flex-shrink: 0; width: 22px; height: 22px; margin: 0; accent-color: #2E7333">
<span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
<span style="font-size: 15.5px; line-height: 21px; font-weight: 600">Pin this goal</span>
<span style="font-size: 13px; line-height: 18px; color: #4A5F4D">Pinned goals show on your Home screen</span>
</span>
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #2E7333; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M12 17v5"></path><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg>
</label>

<button type="button" sc-camel-on-click="{{submit}}" style="min-height: 56px; border: 0; border-radius: 18px; background: #2E7333; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Save changes</button>

</div>
</main>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
const TODAY = new Date(2026, 9, 10);
function dateError(d, m, y) {
  const ds = String(d).trim();
  const ms = String(m).trim();
  const ys = String(y).trim();
  if (!/^\d{1,2}$/.test(ds) || !/^\d{1,2}$/.test(ms) || !/^\d{4}$/.test(ys)) return 'Enter the date as DD / MM / YYYY';
  const day = parseInt(ds, 10);
  const mon = parseInt(ms, 10);
  const yr = parseInt(ys, 10);
  const dt = new Date(yr, mon - 1, day);
  if (dt.getFullYear() !== yr || dt.getMonth() !== mon - 1 || dt.getDate() !== day) return 'Enter a real date';
  if (dt <= TODAY) return 'Pick a date after today (10 Oct 2026)';
  return '';
}
class Component extends DCLogic {
  componentWillUnmount() {
    clearTimeout(this.toastTimer);
  }
  showToast(text) {
    clearTimeout(this.toastTimer);
    this.setState({ toast: text });
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 2800);
  }
  renderVals() {
    const s = this.state || {};
    const g = Proto.getGoal(Proto.param('id'));
    const priority = s.priority ?? g.priority;
    const pinned = s.pinned ?? g.pinned;
    const name = s.name ?? g.name;
    const amount = s.amount ?? g.amount;
    const desc = s.desc ?? g.desc;
    const day = s.day ?? g.day;
    const month = s.month ?? g.month;
    const year = s.year ?? g.year;
    const tried = !!s.tried;

    const amountNum = parseFloat(String(amount).replace(/[$,\s]/g, ''));
    const nameErr = name.trim() === '' ? 'Enter a goal name' : '';
    const amountErr = amountNum > 0 ? '' : 'Enter an amount over $0';
    const dateErr = dateError(day, month, year);
    const valid = !nameErr && !amountErr && !dateErr;

    const opt = (id) => priority === id
      ? { checked: true, border: '#2E7333', bg: '#E6F4D8', weight: '700' }
      : { checked: false, border: '#C5D6B8', bg: '#FFFFFF', weight: '600' };
    const setter = (key) => (e) => this.setState({ [key]: e.target.value });
    const bd = (err) => (tried && err ? '#B42318' : '#C5D6B8');
    return {
      name: name,
      amount: amount,
      desc: desc,
      day: day,
      month: month,
      year: year,
      setName: setter('name'),
      setAmount: setter('amount'),
      setDesc: setter('desc'),
      setDay: setter('day'),
      setMonth: setter('month'),
      setYear: setter('year'),
      nameErr: nameErr,
      amountErr: amountErr,
      dateErr: dateErr,
      nameErrShow: tried && !!nameErr,
      amountErrShow: tried && !!amountErr,
      dateErrShow: tried && !!dateErr,
      nameBd: bd(nameErr),
      amountBd: bd(amountErr),
      dateBd: bd(dateErr),
      high: opt('high'),
      medium: opt('medium'),
      minimal: opt('minimal'),
      pickHigh: () => this.setState({ priority: 'high' }),
      pickMedium: () => this.setState({ priority: 'medium' }),
      pickMinimal: () => this.setState({ priority: 'minimal' }),
      pinned: pinned,
      togglePin: () => this.setState({ pinned: !pinned }),
      backHref: g.href,
      submit: () => {
        if (!valid) {
          this.setState({ tried: true });
          this.showToast('Check the highlighted fields');
          return;
        }
        Proto.updateGoal(g.id, {
          name: name.trim(),
          target: Math.round(amountNum * 100) / 100,
          desc: desc.trim(),
          priority: priority,
          pinned: pinned,
          due: year.trim() + '-' + String(parseInt(month, 10)).padStart(2, '0') + '-' + String(parseInt(day, 10)).padStart(2, '0')
        });
        Proto.go(g.href, 'back');
      },
      hasToast: !!s.toast,
      toast: s.toast || ''
    };
  }
}
</script>
